
name: Generate Caraka Icons

on:
  push:
    branches:
      - main
    paths:
      - 'icons/**'
      - 'scripts/**'
      - '.github/workflows/generate-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caraka-icons-generator-main
  cancel-in-progress: false

jobs:
  generate:
    name: Generate CSS and Icon Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "scripts/generate_icons.py" ]; then
            echo "::error::File scripts/generate_icons.py tidak ditemukan."
            exit 1
          fi

          if [ ! -d "icons" ]; then
            echo "::error::Folder icons tidak ditemukan."
            exit 1
          fi

          if ! find icons -type f -iname '*.webp' -print -quit | grep -q .; then
            echo "::error::Tidak ada file WebP di folder icons."
            echo "Tambahkan minimal satu file .webp yang valid."
            exit 1
          fi

      - name: Generate CSS and manifest
        run: python scripts/generate_icons.py

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail

          for file in caraka-icons.css icons.json; do
            if [ ! -s "$file" ]; then
              echo "::error::File $file tidak ditemukan atau kosong."
              exit 1
            fi
          done

          python -m json.tool icons.json > /dev/null

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add caraka-icons.css icons.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan CSS atau manifest."
            exit 0
          fi

          git commit -m "Auto-generate Caraka Icons"
          git push origin HEAD:main
